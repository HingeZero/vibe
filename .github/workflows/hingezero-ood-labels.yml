name: HingeZero VIBE OOD learned-label diagnostics
on:
  push:
    branches: [hingezero-mips-research-20261025]
    paths:
      - verification/research_ood_labels.py
      - .github/workflows/hingezero-ood-labels.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
      HINGEZERO_CPP20_LIB: /tmp/libhz20.so
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.4 h5py==3.16.0 numba==0.65.1 psutil==7.2.2 polars==1.37.1 tqdm
      - run: g++ -O3 -std=c++20 -fPIC -shared -DNDEBUG -ffp-contract=off vibe/algorithms/hingezero_cpp20/native/HingeZero_VIBE_Cpp20.cpp -o "$HINGEZERO_CPP20_LIB"
      - run: python run.py --local --force --runs 1 --parallelism 1 --dataset yi-128-ip --algorithm hingezero --count 100
      - run: python verification/research_ood_labels.py
