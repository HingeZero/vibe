name: HingeZero C++20 two-step VIBE experiment
on:
  push:
    branches:
      - hingezero-cpp20-vibe
      - hingezero-cpp-v3-vibe
      - hingezero-cpp20-two-step-vibe-lab
    paths:
      - .github/workflows/hingezero-cpp20.yml
      - vibe/algorithms/hingezero_cpp20/**
      - verification/smoke_hingezero_cpp20.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vibe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONHASHSEED: "0"
      HINGEZERO_CPP20_LIB: /tmp/libhz20.so
      HZ20_ORIGINAL_EXE: /tmp/hz20_original
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install VIBE dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.4.4 h5py==3.16.0 numba==0.65.1 psutil==7.2.2 polars==1.37.1 tqdm
      - name: Compile original and adapted HingeZero with C++20
        run: |
          g++ -O3 -std=c++20 -ffp-contract=off vibe/algorithms/hingezero_cpp20/native/HingeZero_Native_1B.cpp -o "$HZ20_ORIGINAL_EXE"
          g++ -O3 -std=c++20 -fPIC -shared -DNDEBUG -ffp-contract=off vibe/algorithms/hingezero_cpp20/native/HingeZero_VIBE_Cpp20.cpp -o "$HINGEZERO_CPP20_LIB"
      - name: Prove two-step HingeZero memory and metric correctness
        run: python verification/smoke_hingezero_cpp20.py
      - name: Run two-step HingeZero C++20 algorithm
        run: |
          python run.py --local --force --runs 5 --parallelism 1 --dataset yi-128-ip --algorithm hingezero --count 100
      - name: Export single VIBE score
        run: |
          python export_results.py --parallelism 1 --skip-pca-mahalanobis
          python - <<'PY'
          import polars as pl
          import os
          from pathlib import Path
          d=pl.read_parquet("results/summary.parquet")
          d=d.filter(pl.col("algorithm")=="hingezero")
          assert d.height==1, f"Expected exactly ONE HingeZero submission score, got {d.height}"
          r=d.to_dicts()[0]
          assert 0 <= r["recall"] <= 1 and r["qps"] > 0
          report=("\n".join([
            "# HingeZero C++20: two dual-tanh refinement steps (experimental)",
            "",
            "Dataset: yi-128-ip · k=100 · one CPU benchmark core · five timed runs.",
            "The native HingeZero refinement function runs exactly two dual-tanh steps.",
            "Search checks compact int16 score bounds, exact original float32 candidates and native witness integrity.",
            "Author-run research result; the original query remains the VIBE scoring reference.",
            "",
            "| Recall@100 | QPS | Build seconds |",
            "|---:|---:|---:|",
            f"| {r['recall']:.5f} | {r['qps']:.2f} | {r['build_time']:.2f} |",
            "",
            "The candidate bounds preserve exact top-100 ranking for the refined cue;",
            "VIBE recall against the original cue can decrease after refinement."
          ])+"\n")
          Path("results/HINGEZERO_CPP20_TWO_STEP_REPORT.md").write_text(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f: f.write(report)
          print(report)
          PY
      - name: Upload single submitted result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hingezero-cpp20-two-step-vibe
          retention-days: 30
          if-no-files-found: warn
          path: |
            results/**/*.hdf5
            results/summary.parquet
            results/HINGEZERO_CPP20_TWO_STEP_REPORT.md
            vibe.log
