name: HingeZero C++20 (0 steps) VIBE submission
on:
  push:
    branches:
      - hingezero-cpp20-vibe
      - hingezero-cpp-v3-vibe
      - hingezero-cpp20-500qps-lab
      - hingezero-cpp20-2bit-vibe-lab
      - hingezero-cpp20-2bit-8bit-cascade
    paths:
      - .github/workflows/hingezero-cpp20.yml
      - vibe/algorithms/hingezero_cpp20/**
      - verification/smoke_hingezero_cpp20.py
      - verification/benchmark_hz500_matched.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vibe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONHASHSEED: "0"
      HINGEZERO_CPP20_LIB: /tmp/libhz20.so
      HZ20_ORIGINAL_EXE: /tmp/hz20_original
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install VIBE dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.4.4 h5py==3.16.0 numba==0.65.1 psutil==7.2.2 polars==1.37.1 tqdm
      - name: Compile original and adapted HingeZero with C++20
        run: |
          g++ -O3 -std=c++20 -ffp-contract=off vibe/algorithms/hingezero_cpp20/native/HingeZero_Native_1B.cpp -o "$HZ20_ORIGINAL_EXE"
          g++ -O3 -std=c++20 -fPIC -shared -DNDEBUG -ffp-contract=off vibe/algorithms/hingezero_cpp20/native/HingeZero_VIBE_Cpp20.cpp -o "$HINGEZERO_CPP20_LIB"
      - name: Compile matching submitted C++20 reference
        run: |
          git show 8406576d16f60c990770b053f58d59feeb7b4f13:vibe/algorithms/hingezero_cpp20/native/HingeZero_VIBE_Cpp20.cpp > /tmp/hz500_reference.cpp
          g++ -O3 -std=c++20 -fPIC -shared -DNDEBUG -ffp-contract=off /tmp/hz500_reference.cpp -o /tmp/hz500_reference.so
      - name: Prove zero-step HingeZero memory and metric correctness
        run: python verification/smoke_hingezero_cpp20.py
      - name: Run single submitted HingeZero C++20 algorithm
        run: |
          python run.py --local --force --runs 5 --parallelism 1 --dataset yi-128-ip --algorithm hingezero --count 100
      - name: Matched-host exact top-100 parity and throughput
        env:
          HZ500_REFERENCE_LIB: /tmp/hz500_reference.so
        run: python verification/benchmark_hz500_matched.py
      - name: Export single VIBE score
        run: |
          python export_results.py --parallelism 1 --skip-pca-mahalanobis
          python - <<'PY'
          import polars as pl
          import os
          from pathlib import Path
          d=pl.read_parquet("results/summary.parquet")
          d=d.filter(pl.col("algorithm")=="hingezero")
          assert d.height==1, f"Expected exactly ONE HingeZero submission score, got {d.height}"
          r=d.to_dicts()[0]
          assert 0 <= r["recall"] <= 1 and r["qps"] > 0
          report=("\n".join([
            "# HingeZero C++20: single zero-refinement VIBE submission",
            "",
            "Dataset: yi-128-ip · k=100 · one CPU benchmark core · five timed runs.",
            "The native HingeZero refinement function runs with steps=0, NOT bypassed.",
            "Search uses packed 2-bit candidate ordering plus 8-bit certified bounds, exact original float32 candidates and native witness integrity.",
            "Author-run GitHub measurement; not an organizer-certified score.",
            "",
            "| Recall@100 | QPS | Build seconds |",
            "|---:|---:|---:|",
            f"| {r['recall']:.5f} | {r['qps']:.2f} | {r['build_time']:.2f} |",
            "",
            "The candidate bounds preserve exact top-100 retrieval on this dataset;",
            "official independent review and comparisons with other ANN indexes remain pending."
          ])+"\n")
          Path("results/HINGEZERO_CPP20_ZERO_REPORT.md").write_text(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f: f.write(report)
          print(report)
          PY
      - name: Upload single submitted result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hingezero-cpp20-zero-vibe
          retention-days: 30
          if-no-files-found: warn
          path: |
            results/**/*.hdf5
            results/summary.parquet
            results/HINGEZERO_CPP20_ZERO_REPORT.md
            vibe.log
