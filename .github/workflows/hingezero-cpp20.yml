name: HingeZero original C++20 / VIBE full-bank
on:
  push:
    branches:
      - hingezero-cpp20-vibe
    paths:
      - .github/workflows/hingezero-cpp20.yml
      - vibe/algorithms/hingezero_cpp20/**
      - verification/smoke_hingezero_cpp20.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONHASHSEED: "0"
      HINGEZERO_CPP20_LIB: /tmp/libhz20.so
      HZ20_ORIGINAL_EXE: /tmp/hz20_original
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install VIBE evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.4.4 h5py==3.16.0 numba==0.65.1 psutil==7.2.2 polars==1.37.1 tqdm
      - name: Compile unchanged original and VIBE-adapted C++20 kernels
        run: |
          g++ --version
          g++ -O3 -std=c++20 -ffp-contract=off vibe/algorithms/hingezero_cpp20/native/HingeZero_Native_1B.cpp -o "$HZ20_ORIGINAL_EXE"
          g++ -O3 -std=c++20 -fPIC -shared -DNDEBUG -ffp-contract=off vibe/algorithms/hingezero_cpp20/native/HingeZero_VIBE_Cpp20.cpp -o "$HINGEZERO_CPP20_LIB"
          test -s "$HZ20_ORIGINAL_EXE"
          test -s "$HINGEZERO_CPP20_LIB"
      - name: Confirm original C++20 parity, append, native witness, all four VIBE metrics
        run: python verification/smoke_hingezero_cpp20.py
      - name: VIBE yi-128-ip original C++20 HingeZero and full-scan baseline
        run: |
          python run.py --local --force --runs 1 --parallelism 1 --dataset yi-128-ip --algorithm hingezero-cpp20-refined --count 100
          python run.py --local --force --runs 1 --parallelism 1 --dataset yi-128-ip --algorithm hingezero-cpp20-raw --count 100
      - name: Export validated official VIBE recall@100 and QPS
        run: |
          python export_results.py --parallelism 1 --skip-pca-mahalanobis
          python - <<'PY'
          import os
          from pathlib import Path
          import polars as pl
          d=pl.read_parquet("results/summary.parquet")
          d=d.filter(pl.col("algorithm").is_in(["hingezero-cpp20-refined","hingezero-cpp20-raw"]))
          assert d.height==2, f"Expected two C++20 official result rows; got {d.height}"
          lines=[
              "# HingeZero original C++20 VIBE floating-vector adaptation",
              "",
              "Original C++20 bipolar-source parity passed; VIBE yi-128-ip dataset;",
              "full original-record float32 scan, no FAISS or sign-index shortlist.",
              "",
              "**Author-run GitHub Actions measurements; not organizer-certified.**",
              "",
              "| Method | VIBE recall@100 | QPS | Build seconds |",
              "|---|---:|---:|---:|",
          ]
          for row in d.sort("algorithm").to_dicts():
              assert 0<=row["recall"]<=1 and row["qps"]>0
              lines.append(f"| {row['algorithm']} | {row['recall']:.5f} | {row['qps']:.2f} | {row['build_time']:.2f} |")
          lines.extend(["",
              "Raw control is an **exact exhaustive search** against the unaltered query;",
              "the C++20 HingeZero engine scans every original vector using its refined cue.",
              "Any drop in recall is genuine VIBE disagreement with the refined cue.",
              "These are not approximate ANN index throughput results."])
          report="\n".join(lines)+"\n"
          Path("results/HINGEZERO_CPP20_REPORT.md").write_text(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:f.write(report)
          print(report)
          PY
      - name: Attach benchmark scores, raw VIBE HDF5 and runner log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hingezero-cpp20-original-adapted-vibe
          retention-days: 30
          if-no-files-found: warn
          path: |
            results/**/*.hdf5
            results/summary.parquet
            results/HINGEZERO_CPP20_REPORT.md
            vibe.log
