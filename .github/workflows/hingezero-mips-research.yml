name: HingeZero exact MIPS research diagnostics
on:
  push:
    branches:
      - hingezero-mips-research-20261025
    paths:
      - .github/workflows/hingezero-mips-research.yml
      - verification/research_mips_geometry.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      HINGEZERO_CPP20_LIB: /tmp/libhz20.so
      HZ20_ORIGINAL_EXE: /tmp/hz20_original
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install VIBE research dependencies
        run: python -m pip install numpy==2.4.4 h5py==3.16.0 numba==0.65.1 psutil==7.2.2 polars==1.37.1 tqdm
      - name: Compile exact submitted version for dataset preparation
        run: |
          g++ -O3 -std=c++20 -fPIC -shared -DNDEBUG -ffp-contract=off vibe/algorithms/hingezero_cpp20/native/HingeZero_VIBE_Cpp20.cpp -o "$HINGEZERO_CPP20_LIB"
      - name: Prepare original VIBE dataset and validate native exact search
        run: python run.py --local --force --runs 1 --parallelism 1 --dataset yi-128-ip --algorithm hingezero --count 100
      - name: Diagnose PCA energy and exact top-100 pruning feasibility
        run: python verification/research_mips_geometry.py
