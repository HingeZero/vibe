name: HingeZero experimental learned routing VIBE CPU
on:
  push:
    branches:
      - hingezero-learned-routing-lab-20261025
    paths:
      - .github/workflows/hingezero-learned-routing.yml
      - vibe/algorithms/hingezero_learning/**
      - vibe/algorithms/hingezero_cpp20/native/HingeZero_VIBE_Cpp20.cpp
      - verification/smoke_hingezero_learned.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vibe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
      HINGEZERO_CPP20_LIB: /tmp/libhz20learned.so
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only benchmark dependencies
        run: |
          python -m pip install numpy==2.4.4 h5py==3.16.0 numba==0.65.1 psutil==7.2.2 polars==1.37.1 tqdm hnswlib==0.8.0
      - name: Compile experimental HingeZero witness and candidate ranking
        run: |
          g++ -O3 -std=c++20 -fPIC -shared -DNDEBUG -ffp-contract=off vibe/algorithms/hingezero_cpp20/native/HingeZero_VIBE_Cpp20.cpp -o "$HINGEZERO_CPP20_LIB"
      - name: Smoke test original-memory ranking and witnesses
        run: python verification/smoke_hingezero_learned.py
      - name: Single-core OOD VIBE benchmark, k100, five runs
        run: |
          python run.py --local --force --runs 5 --parallelism 1 --dataset yi-128-ip --algorithm hingezero-learned --count 100
      - name: Export result and all routing budgets
        run: |
          python export_results.py --parallelism 1 --skip-pca-mahalanobis
          python - <<'PY'
          import polars as pl
          d=pl.read_parquet("results/summary.parquet")
          d=d.filter(pl.col("algorithm")=="hingezero-learned").sort("qps",descending=True)
          for r in d.to_dicts():
              print("LEARNED_VIBE",f"recall={r['recall']:.6f}",f"qps={r['qps']:.2f}",
                  f"build_s={r['build_time']:.2f}",f"params={r['params']}",flush=True)
          assert d.height>=3,f"Expected several routing budgets, got {d.height}"
          PY
      - name: Archive research outputs
        uses: actions/upload-artifact@v4
        with:
          name: hingezero-learned-vibe
          retention-days: 30
          path: |
            results/**/*.hdf5
            results/summary.parquet
            vibe.log
