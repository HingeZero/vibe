name: HingeZero VIBE reproducibility run
on:
  push:
    branches: [hz-vibe-evaluation-20261027]
  workflow_dispatch:
jobs:
  yi-128-ip:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install --no-cache-dir numpy==1.26.4 h5py==3.11.0 faiss-cpu==1.12.0
      - name: Official dataset
        run: curl -fL --retry 3 -o yi-128-ip.hdf5 https://huggingface.co/datasets/vector-index-bench/vibe/resolve/main/yi-128-ip.hdf5
      - name: Single-core reproduction
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python scripts/bench_hz_official.py --dataset yi-128-ip.hdf5 --queries 300 --output hz_vibe_results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hingezero-vibe-yi-128-ip
          path: hz_vibe_results.json
          if-no-files-found: ignore
