# Native kernel pinned to HingeZero/big-ann-benchmarks commit 1fc8c554...
# FAISS-assisted dual-tanh refinement, not 1-bit packed storage.
float:
  any:
  - name: hingezero
    module: vibe.algorithms.hingezero
    constructor: HingeZeroVIBE
    singularity_image: hingezero
    disabled: false
    gpu: false
    ood: false
    base_args: ['@metric']
    run_groups:
      full-v3:
        args:
          nlist: [256]
          pq_m: [64]
          pq_bits: [8]
          train_size: [20000]
        query_args:
          nprobe: [16, 32, 64]
          candidates: [256, 512]
          expansion_candidates: [256]
          steps: [8]
