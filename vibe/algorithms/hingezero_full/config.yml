float:
  any:
    - name: hingezero-full
      module: vibe.algorithms.hingezero_full
      constructor: HingeZeroFullMemory
      singularity_image: hingezero_full
      disabled: false
      gpu: false
      ood: false
      base_args: ['@metric']
      run_groups:
        standalone:
          args:
            field_limit: [256]
            alpha: [4.5]
          query_args:
            candidate_budget: [256, 512, 1024]
            expansion_budget: [512]
            steps: [8]
    - name: hingezero-packed-control
      module: vibe.algorithms.hingezero_full
      constructor: HingeZeroPackedControl
      singularity_image: hingezero_full
      disabled: false
      gpu: false
      ood: false
      base_args: ['@metric']
      run_groups:
        matched:
          args:
            field_limit: [256]
            alpha: [4.5]
          query_args:
            candidate_budget: [256, 512, 1024]
            expansion_budget: [512]
            steps: [8]
